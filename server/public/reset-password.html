<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password — Electro World Staff</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 360px;
    margin: 16px;
    background: #fff;
    border-radius: 12px;
    padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 20px;
    color: #666;
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #1a56db;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #a7bde8;
    cursor: default;
  }
  .message {
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
  }
  .message.error { color: #c0152f; }
  .message.success { color: #1a7f37; }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1>Reset your password</h1>
    <p class="subtitle">Electro World Staff</p>
    <div id="content"></div>
  </div>

  <script>
    // Supabase's recovery link puts tokens in the URL fragment, e.g.
    // #access_token=...&refresh_token=...&type=recovery
    // (or #error=access_denied&error_code=otp_expired&... if the link expired).
    var SUPABASE_URL = "https://hniubfjndpmftnuqtrjw.supabase.co";
    var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuaXViZmpuZHBtZnRudXF0cmp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMTczNjIsImV4cCI6MjA5OTY5MzM2Mn0.taWZwNv4Zy9Uy6xgL3mTMe_fyY7dV-02rheObG8nDrI";

    function parseHashParams() {
      var hash = window.location.hash.replace(/^#/, "");
      var params = {};
      hash.split("&").forEach(function (pair) {
        if (!pair) return;
        var parts = pair.split("=");
        params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || "");
      });
      return params;
    }

    function renderError(message) {
      document.getElementById("content").innerHTML =
        '<p class="message error">' + message + "</p>";
    }

    function renderSuccess() {
      document.getElementById("content").innerHTML =
        '<p class="message success">Your password has been updated. You can close this page and log in from the app with your new password.</p>';
    }

    function renderForm(accessToken) {
      var content = document.getElementById("content");
      content.innerHTML =
        '<label for="pw">New password</label>' +
        '<input type="password" id="pw" autocomplete="new-password" />' +
        '<label for="pw2">Confirm password</label>' +
        '<input type="password" id="pw2" autocomplete="new-password" />' +
        '<div id="formError" class="message error" style="margin-bottom:12px;"></div>' +
        '<button id="submitBtn">Set new password</button>';

      document.getElementById("submitBtn").addEventListener("click", function () {
        var pw = document.getElementById("pw").value;
        var pw2 = document.getElementById("pw2").value;
        var errorEl = document.getElementById("formError");
        errorEl.textContent = "";

        if (pw.length < 8) {
          errorEl.textContent = "Password must be at least 8 characters.";
          return;
        }
        if (pw !== pw2) {
          errorEl.textContent = "Passwords do not match.";
          return;
        }

        var btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Updating...";

        fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + accessToken
          },
          body: JSON.stringify({ password: pw })
        })
          .then(function (res) {
            if (!res.ok) {
              return res.json().then(function (body) {
                throw new Error((body && (body.msg || body.error_description)) || "Could not update password.");
              });
            }
            renderSuccess();
          })
          .catch(function (err) {
            btn.disabled = false;
            btn.textContent = "Set new password";
            errorEl.textContent = err.message || "Something went wrong. Please request a new reset link.";
          });
      });
    }

    var params = parseHashParams();
    if (params.error) {
      renderError(
        (params.error_description || "This reset link is invalid or has expired.").replace(/\+/g, " ") +
          " Please request a new one from the app."
      );
    } else if (params.type === "recovery" && params.access_token) {
      renderForm(params.access_token);
    } else {
      renderError("This reset link is invalid or has expired. Please request a new one from the app.");
    }
  </script>
</body>
</html>
